<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <title>Вікі — Королівство Без Назви</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="css/wiki-style.css">
</head>

<body>
  <div id="app">Завантаження хронік...</div>

  <button class="sidebar-toggle-side" onclick="toggleSidebarPosition()">⇄ Меню Ліво/Право</button>

  <script>
    window.$docsify = {
      name: 'Вікі — Королівство Без Назви',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 4,
      sidebarDisplayLevel: 1,
      homepage: 'home.md',

      sidebarCollapse: {
        collapseLevel: 1,
        subLevels: 4
      },

      pagination: {
        previousText: '← Попередня сторінка',
        nextText: 'Наступна сторінка →',
        crossChapter: true,
        crossChapterText: true
      },

      'flexible-alerts': {
        style: 'flat',
        note: { title: "Примітка" },
        tip: { title: "Порада" },
        warning: { title: "Увага" },
        attention: { title: "Важливо" }
      },

      copyCode: {
        buttonText: 'Скопіювати',
        errorText: 'Помилка',
        successText: 'Скопійовано!'
      },

      footer: {
        copy: '<span>&copy; 2026 <b>Super Server</b>. Усі права захищено.</span>',
        auth: 'MIT License',
        preNav: '<hr/>',
        style: 'text-align: center; font-size: 0.9em; opacity: 0.8;'
      },

      count: {
        countable: true,
        position: 'top',
        margin: '10px',
        float: 'right',
        fontsize: '0.9em',
        color: '#888888',
        language: 'uk',
        isFormat: true,
        localization: {
          words: 'слів',
          minute: 'хв. читання'
        }
      },

      progress: {
        position: "top",
        color: "#dca355",
        height: "3px",
      },

      giscus: {
        repo: "vadymhusarovv-stack/Super_Server_Site",
        repoId: "R_kgDOS2t90w",
        category: "General",
        categoryId: "DIC_kwDOS2t9084DFOx-",
        mapping: "pathname",
        reactionsEnabled: "1",
        strict: "0",
        emitMetadata: "0",
        inputPosition: "top",
        theme: "dark",
        lang: "uk",
        loading: "lazy"
      }

    }

    function toggleSidebarPosition() {
      document.body.classList.toggle('sidebar-right');

    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify-footer-enh/dist/docsify-footer-enh.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>

  <script src="https://cdn.jsdelivr.net/npm/docsify-count@latest/dist/countable.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/docsify-progress@latest/dist/progress.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/docsify-giscus@1/dist/docsify-giscus.min.js"></script>
